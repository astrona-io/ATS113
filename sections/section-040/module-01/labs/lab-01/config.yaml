# Give Alice One Identity Across Two Logins
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed, Keycloak 26.8.1 with the realm inventory"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-040-01-setup"
      description: "Configures userpass with alice, the oidc role person and the policy ops-shared, with no entities"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-entity-aliases"
      description: "Confirms the entity alice has one alias on userpass and one on oidc"
      type: "file"
      source: "validation/validate-entity-aliases.sh"
    - name: "validate-same-entity"
      description: "Confirms a userpass login and a JWT login both return the entity alice"
      type: "file"
      source: "validation/validate-same-entity.sh"
    - name: "validate-group-policy"
      description: "Confirms alice is in the internal group ops and her tokens carry ops-shared"
      type: "file"
      source: "validation/validate-group-policy.sh"

teardown:
  keepCluster: false
