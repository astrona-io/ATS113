# Join Logins Into One Identity (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs the preparation script, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and bao, install OpenBao initialized and unsealed, start Keycloak, and configure userpass and the oidc role person."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
