# Issue Identity Tokens For Alice
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-040-02-setup"
      description: "Enables userpass, creates the user alice and the policy identity-reader, and creates an entity alice with an alias"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-entity-metadata"
      description: "Confirms the entity alice keeps its userpass alias and has the metadata team=inventory"
      type: "file"
      source: "validation/validate-entity-metadata.sh"
    - name: "validate-key-and-role"
      description: "Confirms the key inventory and the role inventory-reader have the requested settings"
      type: "file"
      source: "validation/validate-key-and-role.sh"
    - name: "validate-identity-token"
      description: "Confirms alice logs in, reads an identity token with the right claims, and introspection accepts it"
      type: "file"
      source: "validation/validate-identity-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
