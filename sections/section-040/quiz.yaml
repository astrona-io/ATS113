# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats113-040
course_id: ATS113
exam_code: OPENBAO
status: alpha
provenance: Original practice material; not official exam questions.
scope:
  type: section
  id: section-040
  title: 'Identity: Entities, Aliases And Groups'
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
- id: ats113-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Define an alias
  source_readings:
  - sections/section-040/module-01/course-01-entities-and-aliases.md
  prompt: What does an alias record?
  options:
  - id: a
    text: A second password for an entity.
    explanation: Not correct. An alias holds no password.
  - id: b
    text: That an account name on one auth mount belongs to an entity.
    explanation: Correct. It is keyed by name and mount accessor.
  - id: c
    text: A policy attached to a group.
    explanation: Not correct. Policies belong to groups and entities.
  - id: d
    text: The TTL of a token.
    explanation: Not correct. TTLs are token settings.
  correct_option: b
  explanation: Correct. It is keyed by name and mount accessor.
- id: ats113-040-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Predict entity creation
  source_readings:
  - sections/section-040/module-01/course-01-entities-and-aliases.md
  prompt: A person logs in with userpass and, separately, with OIDC. No entity exists.
    How many entities does OpenBao create?
  options:
  - id: a
    text: One, joined by the user name.
    explanation: Not correct. Nothing joins them by name.
  - id: b
    text: None, until a group exists.
    explanation: Not correct. A login creates an entity.
  - id: c
    text: Two, one for each login.
    explanation: Correct. Each first login creates its own entity and alias.
  - id: d
    text: Three, one per policy.
    explanation: Not correct. Entities are not created per policy.
  correct_option: c
  explanation: Correct. Each first login creates its own entity and alias.
- id: ats113-040-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Use the mount accessor
  source_readings:
  - sections/section-040/module-01/course-01-entities-and-aliases.md
  prompt: Which value do you give `identity/entity-alias` to name the auth mount?
  options:
  - id: a
    text: The mount path, such as `userpass/`.
    explanation: Not correct. The path is not the key.
  - id: b
    text: The role name.
    explanation: Not correct. Roles are not mounts.
  - id: c
    text: The entity name.
    explanation: Not correct. That is the entity, not the mount.
  - id: d
    text: The `mount_accessor` from `bao auth list`.
    explanation: Correct. Aliases are keyed by accessor.
  correct_option: d
  explanation: Correct. Aliases are keyed by accessor.
- id: ats113-040-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Repair duplicate entities
  source_readings:
  - sections/section-040/module-01/course-01-entities-and-aliases.md
  prompt: Alice has two entities from two logins. How do you join them without breaking
    references to the ID you keep?
  options:
  - id: a
    text: Merge both into one entity with `identity/entity/merge`.
    explanation: Correct. Merging moves aliases and group memberships.
  - id: b
    text: Delete the entity and create it again.
    explanation: Not correct. The ID changes and references break.
  - id: c
    text: Rename one entity to the other's name.
    explanation: Not correct. Names do not join entities.
  - id: d
    text: Add the entity to an internal group.
    explanation: Not correct. Groups do not merge entities.
  correct_option: a
  explanation: Correct. Merging moves aliases and group memberships.
- id: ats113-040-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Compare policy sources
  source_readings:
  - sections/section-040/module-01/course-02-internal-and-external-groups.md
  prompt: Which policies appear in the token lookup field `identity_policies`?
  options:
  - id: a
    text: Policies from the entity and its groups.
    explanation: Correct. OpenBao checks them on every request.
  - id: b
    text: Policies from the auth method role.
    explanation: Not correct. Those are token policies.
  - id: c
    text: Only the `default` policy.
    explanation: Not correct. `default` is a token policy.
  - id: d
    text: Policies of the parent token.
    explanation: Not correct. Parents do not pass policies.
  correct_option: a
  explanation: Correct. OpenBao checks them on every request.
- id: ats113-040-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict a group change
  source_readings:
  - sections/section-040/module-01/course-02-internal-and-external-groups.md
  prompt: Alice is removed from an internal group. Her existing token carried the
    group's policy. What happens?
  options:
  - id: a
    text: The policy stays until the token expires.
    explanation: Not correct. Identity policies change at once.
  - id: b
    text: The policy disappears from the token without a new login.
    explanation: Correct. Identity policies are checked at each request.
  - id: c
    text: The token is revoked.
    explanation: Not correct. Only policies change.
  - id: d
    text: The entity is deleted.
    explanation: Not correct. The entity stays.
  correct_option: b
  explanation: Correct. Identity policies are checked at each request.
- id: ats113-040-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Set up an external group
  source_readings:
  - sections/section-040/module-01/course-02-internal-and-external-groups.md
  prompt: How does an external group get its members?
  options:
  - id: a
    text: From a list of entity IDs on the group.
    explanation: Not correct. That is an internal group.
  - id: b
    text: From the Kubernetes API server.
    explanation: Not correct. Kubernetes auth does not set it.
  - id: c
    text: From a group alias whose name matches a group name the auth method sees,
      such as a value in the `groups` claim.
    explanation: Correct. OpenBao matches at each login.
  - id: d
    text: From the policy of the group.
    explanation: Not correct. Policies do not set members.
  correct_option: c
  explanation: Correct. OpenBao matches at each login.
- id: ats113-040-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Match group aliases exactly
  source_readings:
  - sections/section-040/module-01/course-02-internal-and-external-groups.md
  prompt: The claim value is `ops` and the group alias is named `Ops`. What happens
    at login?
  options:
  - id: a
    text: The entity joins the group.
    explanation: Not correct. The match is exact.
  - id: b
    text: OpenBao fixes the alias name.
    explanation: Not correct. OpenBao does not change it.
  - id: c
    text: The login is refused.
    explanation: Not correct. The login works but joins no group.
  - id: d
    text: The entity does not join the group, because the match is exact.
    explanation: Correct. Case and path must be the same.
  correct_option: d
  explanation: Correct. Case and path must be the same.
- id: ats113-040-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Read a policy template
  source_readings:
  - sections/section-040/module-01/course-03-identity-in-policies.md
  prompt: What does `{{identity.entity.name}}` in a policy path do?
  options:
  - id: a
    text: It matches any entity name as a wildcard.
    explanation: Not correct. It is a value, not a wildcard.
  - id: b
    text: OpenBao fills it with the name of the requesting token's entity.
    explanation: Correct. It is filled at request time.
  - id: c
    text: It is replaced when the policy is written.
    explanation: Not correct. It is filled per request.
  - id: d
    text: It names the auth mount.
    explanation: Not correct. The mount is a different placeholder.
  correct_option: b
  explanation: Correct. It is filled at request time.
- id: ats113-040-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Diagnose an empty placeholder
  source_readings:
  - sections/section-040/module-01/course-03-identity-in-policies.md
  prompt: A root token reads a path with `{{identity.entity.name}}`. Why does the
    path match nothing?
  options:
  - id: a
    text: The root policy blocks templates.
    explanation: Not correct. Root allows all paths.
  - id: b
    text: Templates need KV version 1.
    explanation: Not correct. They work with KV version 2.
  - id: c
    text: A root token has no entity, so the placeholder is empty.
    explanation: Correct. An empty placeholder matches nothing.
  - id: d
    text: The path needs a trailing slash.
    explanation: Not correct. The missing entity is the cause.
  correct_option: c
  explanation: Correct. An empty placeholder matches nothing.
