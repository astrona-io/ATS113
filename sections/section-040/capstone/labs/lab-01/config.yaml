# Make Groups From Keycloak Drive Access
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed, Keycloak 26.8.1 with the realm inventory"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-capstone-040-setup"
      description: "Creates a duplicate entity for alice, an external group with a wrong alias and a templated policy with the wrong path"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-one-entity"
      description: "Confirms both logins return the original entity alice, not a new one"
      type: "file"
      source: "validation/validate-one-entity.sh"
    - name: "validate-external-group"
      description: "Confirms a JWT login of an ops member gets ops-admin through the external group, and bob does not"
      type: "file"
      source: "validation/validate-external-group.sh"
    - name: "validate-personal-paths"
      description: "Confirms alice can write her own path and cannot read bob's"
      type: "file"
      source: "validation/validate-personal-paths.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
      - quay.io/openbao/openbao:2.7.1
