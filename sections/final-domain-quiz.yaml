  learning_objective: Know why pull is preferred
  source_readings:
  - sections/section-020/module-02/course-02-pull-and-push-secret-ids.md
  prompt: Why is pull mode preferred over push mode?
  options:
  - id: a
    text: A pushed value is only as strong as the system that made it.
    explanation: Correct. OpenBao generates a strong random value, while a pushed
      value depends on its source.
  - id: b
    text: Pull mode uses no accessor.
    explanation: Not correct. OpenBao generates a strong random value, while a pushed
      value depends on its source.
  - id: c
    text: Push mode cannot expire.
    explanation: Not correct. OpenBao generates a strong random value, while a pushed
      value depends on its source.
  - id: d
    text: Pull mode skips the audit log.
    explanation: Not correct. OpenBao generates a strong random value, while a pushed
      value depends on its source.
  correct_option: a
  explanation: Correct. OpenBao generates a strong random value, while a pushed value
    depends on its source.
