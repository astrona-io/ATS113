# Deliver A Secret With A Wrapping Token
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-010-03-setup"
      description: "Adds the KV engine, example secrets and the policies; nothing for the task is created"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-wrapped-secret"
      description: "Confirms the Secret inventory-wrapped holds an unused wrapping token for secret/inventory/db with a 1h TTL"
      type: "file"
      source: "validation/validate-wrapped-secret.sh"
    - name: "validate-service-token"
      description: "Confirms inventory-service-token holds a token with inventory-read and the note in its cubbyhole"
      type: "file"
      source: "validation/validate-service-token.sh"
    - name: "validate-isolation"
      description: "Confirms the note is private to the service token and the wrapping token cannot read secrets"
      type: "file"
      source: "validation/validate-isolation.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
