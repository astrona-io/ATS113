# Issue A Periodic Token For A Service
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-010-01-setup"
      description: "Adds the KV engine, example secrets and the policy inventory-read"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-token-shape"
      description: "Confirms the stored token is an orphan periodic service token with inventory-read and no root"
      type: "file"
      source: "validation/validate-token-shape.sh"
    - name: "validate-token-renews"
      description: "Confirms the token renews itself back to its 24h period"
      type: "file"
      source: "validation/validate-token-renews.sh"
    - name: "validate-token-access"
      description: "Confirms the token reads inventory secrets and is refused report secrets"
      type: "file"
      source: "validation/validate-token-access.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
