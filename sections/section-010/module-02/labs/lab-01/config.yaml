# Set Up A Tuned Staff Login
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-010-02-setup"
      description: "Adds the KV engine, example secrets and the policies; no auth method except token is mounted"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-staff-mount"
      description: "Confirms a userpass mount at staff with the tuned lease limits and no mount at userpass"
      type: "file"
      source: "validation/validate-staff-mount.sh"
    - name: "validate-alice-login"
      description: "Confirms alice logs in at staff with inventory-read and a 30 minute token"
      type: "file"
      source: "validation/validate-alice-login.sh"
    - name: "validate-alice-access"
      description: "Confirms the token of alice reads inventory secrets and is refused report secrets"
      type: "file"
      source: "validation/validate-alice-access.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
