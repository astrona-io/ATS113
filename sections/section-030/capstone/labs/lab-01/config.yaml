# Repair A Broken Keycloak Login
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed, Keycloak 26.8.1 with the realm inventory"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-capstone-030-setup"
      description: "Configures OIDC with three faults and a break-glass userpass account without its policy"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-alice-gets-ops"
      description: "Confirms alice logs in with the role ops and gets the ops policy"
      type: "file"
      source: "validation/validate-alice-gets-ops.sh"
    - name: "validate-bob-refused"
      description: "Confirms bob is still refused and the role still requires the group ops and the audience openbao"
      type: "file"
      source: "validation/validate-bob-refused.sh"
    - name: "validate-breakglass"
      description: "Confirms the userpass account breakglass logs in with the breakglass policy"
      type: "file"
      source: "validation/validate-breakglass.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
      - quay.io/openbao/openbao:2.7.1
