# Log In From The Directory
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-030-02-setup"
      description: "Adds the KV engine, example secrets and policies, and loads the users and groups into OpenLDAP"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ldap-config"
      description: "Confirms auth/ldap is configured with the search account, uid, and the people and groups bases"
      type: "file"
      source: "validation/validate-ldap-config.sh"
    - name: "validate-group-logins"
      description: "Confirms alice, bob and carol log in with the policies of their groups"
      type: "file"
      source: "validation/validate-group-logins.sh"
    - name: "validate-access"
      description: "Confirms the tokens read only what their group allows and a wrong password is refused"
      type: "file"
      source: "validation/validate-access.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - osixia/openldap:1.5.0
      - quay.io/openbao/openbao:2.7.1
