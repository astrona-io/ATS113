# Log People In With Userpass And Keycloak (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs the preparation script, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and bao, add the CoreDNS rewrites, install OpenBao initialized and unsealed, and start Keycloak with the realm inventory."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
