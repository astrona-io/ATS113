# Repair Three Machine Logins
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed, the lab CA, a TLS listener and the client certificate, the inventory application"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-capstone-020-setup"
      description: "Configures Kubernetes, AppRole and TLS certificate auth, each with one fault"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-kubernetes-login"
      description: "Confirms inventory-app logs in with Kubernetes auth and the role stays bound to inventory only"
      type: "file"
      source: "validation/validate-kubernetes-login.sh"
    - name: "validate-approle-login"
      description: "Confirms the stored AppRole credentials log in from the tester pod with ci-deploy"
      type: "file"
      source: "validation/validate-approle-login.sh"
    - name: "validate-cert-login"
      description: "Confirms the client certificate CN=reporting-job logs in with the reporting policy and the role accepts only that name"
      type: "file"
      source: "validation/validate-cert-login.sh"

teardown:
  keepCluster: false
