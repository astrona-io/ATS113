# Helm values for OpenBao v2.7.1 (chart openbao 0.30.4) in ATS113.
# One address everywhere: http://openbao.localtest.me:8200. Inside the
# cluster a CoreDNS rewrite sends that name to the Service `openbao`; on the
# reader's machine a port-forward of port 8200 does. The listener on port
# 8200 has no TLS: lab-only.
fullnameOverride: openbao
injector:
  enabled: false
server:
  image:
    tag: "2.7.1"
  # The Secret openbao-tls is mounted at /openbao/userconfig/openbao-tls/.
  extraVolumes:
    - type: secret
      name: openbao-tls
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      # Second listener with TLS, so clients can log in with a TLS client
      # certificate. Reached through the headless Service name
      # openbao-0.openbao-internal.openbao.svc.cluster.local:8443.
      listener "tcp" {
        address       = "[::]:8443"
        tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
        tls_key_file  = "/openbao/userconfig/openbao-tls/tls.key"
      }

      storage "raft" {
        path    = "/openbao/data"
        node_id = "openbao-0"
      }

      api_addr     = "http://openbao.localtest.me:8200"
      cluster_addr = "http://openbao-0.openbao-internal:8201"
  dataStorage:
    enabled: true
    size: 1Gi
ui:
  enabled: true
