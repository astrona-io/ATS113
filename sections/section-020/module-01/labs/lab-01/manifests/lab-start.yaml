# Client pods for this environment. OpenBao itself is installed by Helm in
# the bootstrap script.
apiVersion: v1
kind: Namespace
metadata:
  name: clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: clients
  labels:
    app: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tester
  template:
    metadata:
      labels:
        app: tester
    spec:
      containers:
        - name: tester
          image: nicolaka/netshoot:v0.13
          command: ["sh", "-c", "while true; do sleep 30; done"]
          volumeMounts:
            - name: client-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: client-tls
          secret:
            secretName: client-tls
            optional: true
---
# The inventory application: it logs in to OpenBao with Kubernetes auth as
# the ServiceAccount `inventory`.
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: inventory
  labels:
    app: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      serviceAccountName: inventory
      containers:
        - name: app
          image: nicolaka/netshoot:v0.13
          command: ["sh", "-c", "while true; do sleep 30; done"]
