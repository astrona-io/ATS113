# Provision A Wrapped Secret ID
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-113-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Helm 3.22.1 and the bao CLI 2.7.1, the CoreDNS rewrite, OpenBao v2.7.1 initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-113-lab-020-02-setup"
      description: "Enables the AppRole auth method without creating any role"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod and any application pods."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao answers unsealed from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-deploy-role"
      description: "Confirms the role deploy has ci-deploy, short token lifetimes and single-use secret IDs"
      type: "file"
      source: "validation/validate-deploy-role.sh"
    - name: "validate-orchestrator-policy"
      description: "Confirms the policy deploy-orchestrator allows only reading the role ID and creating a secret ID for deploy"
      type: "file"
      source: "validation/validate-orchestrator-policy.sh"
    - name: "validate-wrapped-secret-id"
      description: "Confirms the Secret deploy-wrapped-secret-id holds an unused 2h wrapping token for a secret ID and that secret IDs are single use"
      type: "file"
      source: "validation/validate-wrapped-secret-id.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
