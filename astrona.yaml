        title: "Make Groups From Keycloak Drive Access Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: identity
        task_kind: troubleshooting
        tags: [external-group, group-alias, entity, entity-alias, policy-template, keycloak]
        learning_goals:
          - Merge two entities that belong to the same person without losing either login
          - Map the Keycloak group ops to an external group through a group alias on the right mount
          - Prove with a templated policy that each person can write only their own secrets
        resources:
          - name: "Identity"
            url: https://openbao.org/docs/concepts/identity/
          - name: "Identity group alias API"
            url: https://openbao.org/docs/api/secret/identity/group-alias/
          - name: "Policies: templated policies"
