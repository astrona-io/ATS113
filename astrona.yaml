        task_kind: build
        tags: [entity, entity-alias, internal-group, userpass, jwt, policy]
        learning_goals:
          - Create an entity with one alias on the userpass mount and one on the JWT mount
          - Put the entity in an internal group that grants a shared policy
          - Prove that both logins return the same entity ID and the group's policy
        resources:
          - name: "Identity"
            url: https://openbao.org/docs/concepts/identity/
          - name: "Identity entity API"
            url: https://openbao.org/docs/api/secret/identity/entity/
          - name: "Identity entity alias API"
            url: https://openbao.org/docs/api/secret/identity/entity-alias/
      - type: reading
        title: "Identity In Policy Templates"
        path: sections/section-040/module-01/course-03-identity-in-policies.md
      - type: reading
